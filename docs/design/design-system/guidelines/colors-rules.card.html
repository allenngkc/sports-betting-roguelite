<!-- @dsCard group="Colors" viewport="700x150" name="Rules" subtitle="Structural rules. Solid 1–2px, never hairline." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css"></head><body><div class="sw"><div style="background:#3C3C2C;color:#D9D4C5"><b>rule</b><b>#3C3C2C</b><i>structural rules, active tab edge</i></div><div style="background:#2C2C20;color:#D9D4C5"><b>rule-soft</b><b>#2C2C20</b><i>entry separators, ruled paper</i></div></div>
<div style="margin-top:12px;display:flex;flex-direction:column;gap:9px">
<div style="border-top:1px solid var(--rule)"></div><div style="border-top:2px solid var(--rule)"></div><div style="border-top:1px solid var(--rule-soft)"></div>
<div style="height:26px;background:repeating-linear-gradient(180deg,transparent 0 12px,var(--rule-soft) 12px 13px)"></div></div>
<p class="note" style="margin-top:10px">1px, 2px, soft, and the margin's repeating paper ruling. Hairlines disintegrate on the angled laptop surface, so they are banned for anything structural.</p></body></html>
