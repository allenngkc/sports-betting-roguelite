<style>*{box-sizing:border-box;margin:0;padding:0}body{background:var(--ground);color:var(--toner);font-family:var(--font-data);padding:16px 18px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.sp{display:flex;flex-direction:column;gap:7px}
.cap{font-size:12px;letter-spacing:.1em;color:var(--toner-3);text-transform:uppercase}
.dim{font-family:var(--font-mono);font-size:11px;color:var(--wax-deep)}

.tv{background:var(--tv-substrate);font-family:var(--font-tv)}</style></head><body><div id="root"></div>
<script type="text/babel">
const { PriceCell, InkMark, MoreButton, ColumnHead, FormEntry, MarketOffer } = window.SureThingDesignSystem_6e1eb3;
const S = ({c,d,children}) => <div className="sp"><div className="cap">{c}</div><div className="dim">{d}</div><div className="dm">{children}</div></div>;
function Card(){return (<>
  <div className="row" style={{marginBottom:14}}>
    <S c="Default" d="96 × 30"><PriceCell price="-145" /></S>
    <S c="Picked · A" d="ring-price-a"><PriceCell price="-260" state="picked" ringVariant="ring-a" /></S>
    <S c="Picked · B" d="ring-price-b"><PriceCell price="+180" state="picked" ringVariant="ring-b" /></S>
    <S c="Picked · C" d="ring-price-c"><PriceCell price="+125" state="picked" ringVariant="ring-c" /></S>
    <S c="Will replace" d="selectable"><PriceCell price="+210" state="replace" /></S>
    <S c="Won" d="wax re-ink"><PriceCell price="-260" state="won" /></S>
    <S c="Dead" d="house strike"><PriceCell price="+180" state="dead" /></S>
    <S c="More" d="74 × 44"><MoreButton /></S>
  </div>
  <ColumnHead />
  <FormEntry index={1} number="02" selected="home"
    away={{name:"Mallards",record:"3-6",price:"+210"}}
    home={{name:"Bricklayers",record:"8-1",price:"-260"}} />
  <FormEntry index={2} number="03"
    away={{name:"Nighthawks",record:"5-4",price:"+135"}}
    home={{name:"Foundry",record:"6-3",price:"-155"}} />
  <div className="row" style={{marginTop:14}}>
    <S c="Market offer" d="160 × 30"><MarketOffer line="Over 2.5 goals" price="-110" /></S>
    <S c="Picked" d="ring-wide-a"><MarketOffer line="Over 2.5 goals" price="-110" state="picked" /></S>
    <S c="Ink marks" d="tinted alpha"><div style={{display:"flex",gap:10}}>
      <InkMark variant="ring-a" color="var(--biro)" /><InkMark variant="strike" color="var(--stamp)" /></div></S>
  </div>
</>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Card/>);
</script></body></html>
