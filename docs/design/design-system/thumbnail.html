<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SureThing Design System</title><link rel="stylesheet" href="styles.css"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:1280px;height:854px;overflow:hidden}body{display:flex;background:var(--ground)}.mark{flex:1;display:flex;align-items:center;justify-content:center;background:var(--ground);position:relative}.mark span{font-family:var(--font-cond);font-size:196px;line-height:1;letter-spacing:.01em;color:var(--toner);white-space:nowrap;text-transform:uppercase}.strip{width:300px;display:flex;flex-direction:column}.strip i{flex:1;display:block}</style></head><body><div class="mark"><span>SureThing</span></div><div class="strip"><i style="background:var(--wax-lit)"></i><i style="background:var(--wax)"></i><i style="background:var(--biro)"></i><i style="background:var(--stamp)"></i></div></body></html>
