# Stage 1 CI (tracking-brief-2026-08-25): .NET build + engine/console tests.
# No Unity, no LFS checkout. Unity suites stay local until stage 3.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Keep the Unity plugin copy target away from the repo tree (the tracked
      # SBR.Engine.dll must never be rewritten by a build).
      SBR_PLUGIN_DIR: ${{ github.workspace }}\.ci-plugin
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
            'engine/SBR.Engine.csproj',
            'engine.tests/SBR.Engine.Tests.csproj',
            'game-console/SBR.ConsoleGame.csproj',
            'game-console.tests/SBR.ConsoleGame.Tests.csproj',
            'sim/SBR.Sim.csproj'
          )
          foreach ($p in $projects) {
            dotnet build $p -c Release -p:SbrUnityPluginDir="$env:SBR_PLUGIN_DIR"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Engine tests
        shell: pwsh
        run: dotnet test engine.tests/SBR.Engine.Tests.csproj -c Release --no-build -p:SbrUnityPluginDir="$env:SBR_PLUGIN_DIR" --logger "trx;LogFileName=engine.trx" --results-directory TestResults

      - name: Console tests
        shell: pwsh
        run: dotnet test game-console.tests/SBR.ConsoleGame.Tests.csproj -c Release --no-build -p:SbrUnityPluginDir="$env:SBR_PLUGIN_DIR" --logger "trx;LogFileName=console.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
